  <header class="brand-gradient sticky top-0 z-40 text-white shadow-lg shadow-blue-950/15">
    <div class="mx-auto max-w-[1500px] px-4 sm:px-6">
      <div class="flex h-16 items-center justify-between gap-4">
        <a href="#/inicio" class="flex shrink-0 items-center gap-3" aria-label="Devxis Software">
          <span class="grid h-10 w-10 place-items-center rounded-xl bg-white/15 ring-1 ring-white/25 backdrop-blur">
            <svg viewBox="0 0 32 32" class="h-6 w-6" fill="currentColor" aria-hidden="true">
              <path d="M3 25 13.5 4h6L9 25H3Z" opacity=".95"/>
              <path d="M16.5 25 27 4h4.5L21 25h-4.5Z" opacity=".55"/>
            </svg>
          </span>
          <span class="leading-tight">
            <span class="flex items-baseline gap-1.5">
              <span class="text-xl font-extrabold tracking-tight">Devxis</span>
              <span class="text-[11px] font-semibold uppercase tracking-[0.18em] text-blue-100/80">Software</span>
            </span>
            <span class="block text-[10px] font-medium uppercase tracking-[0.2em] text-blue-200/70">Gestión comercial</span>
          </span>
        </a>

        <nav id="main-nav" class="hidden items-center gap-1 md:flex" aria-label="Navegación principal"></nav>

        <div class="flex items-center gap-0.5 sm:gap-1">
          <button class="top-icon" title="Ayuda" aria-label="Ayuda" onclick="App.openHelp()"><svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-help"/></svg></button>
          <button class="top-icon relative" title="Notificaciones" aria-label="Notificaciones" onclick="App.openNotifications()">
            <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bell"/></svg>
            <span id="notif-dot" class="absolute right-2 top-2 hidden h-2 w-2 rounded-full bg-amber-300 ring-2 ring-blue-700"></span>
          </button>
          <button class="top-icon" title="Actualizar datos" aria-label="Actualizar datos" onclick="App.refresh()"><svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg></button>
          <button class="top-icon" title="Configuración" aria-label="Configuración" onclick="App.openSettings()"><svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-settings"/></svg></button>
        </div>
      </div>

      <nav id="mobile-nav" class="no-scrollbar flex items-center gap-1 overflow-x-auto pb-2 md:hidden" aria-label="Navegación móvil"></nav>
    </div>
  </header>
